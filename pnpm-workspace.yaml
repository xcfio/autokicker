packages:
  - "apps/*"
  - "lib/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  msw: true
  sharp: true

minimumReleaseAgeExclude:
  - '@scalar/client-side-rendering@0.3.7'
  - '@scalar/fastify-api-reference@1.65.1'
  - '@scalar/json-magic@0.13.0'
  - '@scalar/openapi-parser@0.28.14'
  - '@scalar/types@0.18.0'
  - '@commitlint/cli@21.2.2'
  - '@commitlint/config-conventional@21.2.2'
  - '@commitlint/format@21.2.2'
  - '@commitlint/is-ignored@21.2.2'
  - '@commitlint/lint@21.2.2'
  - '@commitlint/load@21.2.2'
  - '@commitlint/parse@21.2.2'
  - '@commitlint/resolve-extends@21.2.2'
  - '@commitlint/rules@21.2.2'
  - '@hookform/resolvers@5.8.0'
  - '@next/env@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - commitlint@21.2.2
  - fastify@5.12.0
  - next@16.3.1
  - shadcn@4.18.0
  - temporal-polyfill@1.0.4
  - temporal-utils@1.0.2
